name: Rust

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Linux GLIBC_2_15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build linux
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: i686-unknown-linux-gnu
          override: true
      - name: Run 32-bit Linux Rust unit tests
        uses: actions-rs/cargo@v1
        with:
          use-cross: true
          command: test
          args: --locked --target i686-unknown-linux-gnu
      - uses: actions-rs/cargo@v1
        with:
          use-cross: true # cross uses glibc 2.15
          command: build
          args: --target i686-unknown-linux-gnu --release
      - name: Save Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: samp-precise-timers-linux-x86
          path: target/i686-unknown-linux-gnu/release/libsamp_precise_timers.so
          if-no-files-found: error
          retention-days: 1
      - name: Upload Linux Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        id: upload-linux-release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ./target/i686-unknown-linux-gnu/release/libsamp_precise_timers.so
          replacesArtifacts: false
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          draft: true
          omitBody: true
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        os: [windows-latest]
        rust: [stable]
    steps:
      - uses: hecrj/setup-rust-action@v1
        with:
          rust-version: ${{ matrix.rust }}
      - uses: actions/checkout@v4
      - name: Build for Windows
        run: rustup target add i686-pc-windows-msvc && cargo build --release --target i686-pc-windows-msvc
      - name: Save Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: samp-precise-timers-windows-x86
          path: target/i686-pc-windows-msvc/release/samp_precise_timers.dll
          if-no-files-found: error
          retention-days: 1
      - name: Upload Windows Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        id: upload-windows-release
        uses: ncipollo/release-action@v1
        with:
          artifacts: .\target\i686-pc-windows-msvc\release\samp_precise_timers.dll
          replacesArtifacts: false
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          draft: true
          omitBody: true
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}